# Náhrada kořenového .htaccess pro dev instanci (AllowOverride None).
# Bez https a www přesměrování — TLS končí na Traefiku a dev doména www nemá.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /

        # soubory začínající tečkou
        RewriteRule /\.|^\. - [F]

        # front controller — stejný seznam přípon jako v .htaccess
        RewriteRule !\.(eot|woff|woff2|ttf|php|pdf|js|xls|doc|xlsx|docx|ico|gif|jpg|jpeg|png|svg|css|rar|zip|tar\.gz)$ index.php [L]
    </Directory>

    # .htaccess v podadresářích (filemanager/config) se s AllowOverride None neuplatní
    <DirectoryMatch "^/var/www/html/(app|temp|vendor|_docker|public/plugins/filemanager/config)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(neon|sql|lock)$">
        Require all denied
    </FilesMatch>

    LogLevel warn
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
